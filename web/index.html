<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Attendance by Seat Id</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; text-align: center; }
    table {
      margin: 40px auto;
      border: 2px solid #4682B4;
      border-radius: 15px;
      padding: 20px;
    }
    td { padding: 6px; }
    input[type="text"] { width: 160px; padding: 4px; }
  </style>
</head>
<body>
  <form action="Attend" method="get">
    <table>
      <tr><td>Student Id</td><td><input type="text" name="studentId"></td></tr>
      <tr><td>Seat Id</td><td><input type="text" name="seatId"></td></tr>
      <tr><td colspan="2"><input type="submit" value="Submit"></td></tr>
    </table>
  </form>
  <p><a href="Attend">Attendee List</a></p>
</body>
</html>
